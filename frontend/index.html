<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#176B5C" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e10" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Batua — Smart Money. Simple Life." />

    <!-- Favicon: brand lockup SVG. Tile color follows the browser theme — dark
         tile in dark mode, light tile in light mode. -->
    <link rel="icon" type="image/svg+xml" href="/b_logo_light.svg" sizes="any" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/b_logo_dark.svg"
      media="(prefers-color-scheme: dark)"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/b_logo_light.svg"
      media="(prefers-color-scheme: light)"
      sizes="any"
    />

    <!-- Apple touch icon (iOS uses the light variant by default). -->
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-dark.png"
      media="(prefers-color-scheme: dark)"
    />

    <link rel="manifest" href="/manifest.json" />
    <title>Batua — Personal Finance</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
